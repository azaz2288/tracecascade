[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecascade"
version = "0.1.0"
description = "Evidence-backed change-impact simulation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "azaz2288"}]

[project.scripts]
tracecascade = "tracecascade.__main__:main"

[tool.setuptools.packages.find]
include = ["tracecascade*"]
